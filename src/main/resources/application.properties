spring.application.name=springboot-practice

# 실제 DB 접속 정보(계정/비밀번호)는 application-local.properties에 분리 (git에 커밋 안 됨)
spring.profiles.active=local

# schema.sql로 테이블을 직접 만들기 때문에 Hibernate가 별도로 스키마를 건드리지 않도록 설정
spring.jpa.hibernate.ddl-auto=none

# MySQL 같은 외부 DB에서는 기본적으로 schema.sql을 자동 실행하지 않기 때문에 명시적으로 켜줌
spring.sql.init.mode=always

# 학습 목적: 실행되는 SQL을 콘솔에서 확인
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
